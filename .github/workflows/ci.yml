name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Bundle-size budget
        run: npm run bundle-size

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  typecheck-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript (strict project build)
        run: npx tsc -b

  smoke-preview-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Signal)
        env:
          VITE_E2E_AUTH_BYPASS: 'true'
          VITE_APP_MODE: signal
        run: npx playwright test e2e/smoke.spec.ts

  smoke-preview-venue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Venue)
        env:
          VITE_E2E_AUTH_BYPASS: 'true'
          VITE_APP_MODE: venue
          VITE_VISUAL_PREVIEW: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx playwright test e2e/pulse-creation.spec.ts e2e/search.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Branch protection requires a status check named "smoke-preview" — the name
  # this job had before it was split into smoke-preview-signal / -venue. This
  # aggregator republishes that context from the split jobs so the required
  # check resolves, without weakening the gate: it fails unless the blocking
  # signal smoke job passed. (Venue smoke is advisory — continue-on-error — so
  # it is reported for visibility but does not gate here.)
  smoke-preview:
    runs-on: ubuntu-latest
    needs: [smoke-preview-signal, smoke-preview-venue]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Gate on smoke results
        run: |
          echo "smoke-preview-signal: ${{ needs.smoke-preview-signal.result }}"
          echo "smoke-preview-venue (advisory): ${{ needs.smoke-preview-venue.result }}"
          if [ "${{ needs.smoke-preview-signal.result }}" != "success" ]; then
            echo "::error::Signal smoke tests did not pass"
            exit 1
          fi
          echo "✅ smoke-preview satisfied"

  e2e-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Signal app smoke tests
        env:
          VITE_E2E_AUTH_BYPASS: 'true'
          VITE_APP_MODE: signal
        run: npm run test:e2e:signal

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run dependency audit
        run: npm audit --audit-level=high --json > audit-report.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          if-no-files-found: ignore
