<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pulse Signal — daily check-in & trends</title>
    <meta name="description" content="Pulse Signal: a 10-second daily check-in for energy, mood, and focus—trends, streaks, and one clear next step." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org https://api.github.com;"
    />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!--
      Fonts are self-hosted (see src/styles/fonts.css + public/fonts/). The old
      render-blocking fonts.googleapis.com <link> was the app's biggest perf
      problem — it blocked first paint and, on restricted networks, hung for
      ~12.8s before failing, leaving a blank page until it did.
    -->
</head>

<body>
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
